# Run with `dart run ffigen --config ffigen.yaml`.
name: DeepfilternetBindings
description: |
  Bindings for `src/deepfilternet.h`.

  Regenerate bindings with `dart run ffigen --config ffigen.yaml`.
output: 'lib/deepfilternet_bindings_generated.dart'
headers:
